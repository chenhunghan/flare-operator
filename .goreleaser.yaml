# goreleaser v2 configuration (validated with goreleaser v2.18.2: `make release-check`).
#
# Produces, for a tag vX.Y.Z:
#   - manager (linux) and flarefake (linux, darwin) binaries for amd64 and arm64, archived,
#     with checksums and an SPDX SBOM per archive (syft)
#   - multi-arch images <IMAGE_REGISTRY>/flare-operator and <IMAGE_REGISTRY>/flarefake
#     (linux/amd64 + linux/arm64) with OCI labels and BuildKit SBOM attestations
#   - the Helm chart packaged as flare-operator-X.Y.Z.tgz (chart version = appVersion = X.Y.Z)
#
# A pushed v* tag runs .github/workflows/release.yml: `goreleaser release` pushes the images to
# IMAGE_REGISTRY (default ghcr.io/chenhunghan) and creates the GitHub release with the archives
# and the chart .tgz; the workflow then pushes the chart to oci://ghcr.io/chenhunghan/charts.
# `make release-snapshot` builds everything locally into dist/ and publishes nothing (without a
# git remote goreleaser stamps a snapshot with commit "none" and date 0001-01-01: it ignores
# the git state it cannot fully read). See docs/operations.md "Releases".
version: 2
project_name: flare-operator

env:
  - CGO_ENABLED=0
  - IMAGE_REGISTRY={{ envOrDefault "IMAGE_REGISTRY" "ghcr.io/chenhunghan" }}

before:
  hooks:
    - go mod verify
    # The chart's CRDs and ClusterRoles must match config/ (hack/chartsync).
    - go run ./hack/chartsync -check
    - rm -rf bin/chart
    - helm package charts/flare-operator --version {{ .Version }} --app-version {{ .Version }} --destination bin/chart

builds:
  - id: manager
    main: ./cmd/manager
    binary: manager
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/chenhunghan/flare-operator/internal/version.Version={{ .Version }}
      - -X github.com/chenhunghan/flare-operator/internal/version.Commit={{ .FullCommit }}
      - -X github.com/chenhunghan/flare-operator/internal/version.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"
  - id: flarefake
    main: ./cmd/flarefake
    binary: flarefake
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/chenhunghan/flare-operator/internal/version.Version={{ .Version }}
      - -X github.com/chenhunghan/flare-operator/internal/version.Commit={{ .FullCommit }}
      - -X github.com/chenhunghan/flare-operator/internal/version.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: manager
    ids: [manager]
    name_template: "manager_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
  - id: flarefake
    ids: [flarefake]
    name_template: "flarefake_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    # flarefake validates requests against the pinned spec (-spec).
    files:
      - LICENSE
      - NOTICE
      - README.md
      - spec/openapi.json.gz
      - spec/LOCK
      - spec/LICENSE

checksum:
  name_template: checksums.txt

sboms:
  - id: archives
    artifacts: archive

dockers_v2:
  - id: manager
    ids: [manager]
    dockerfile: hack/release/Dockerfile.manager
    images: ["{{ .Env.IMAGE_REGISTRY }}/flare-operator"]
    tags: ["{{ .Version }}", "{{ if not .Prerelease }}latest{{ end }}"]
    platforms: [linux/amd64, linux/arm64]
    sbom: true
    labels:
      org.opencontainers.image.title: flare-operator
      org.opencontainers.image.description: Kubernetes operator for Cloudflare resources
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .CommitDate }}"
      org.opencontainers.image.base.name: gcr.io/distroless/static-debian12:nonroot
      org.opencontainers.image.source: https://github.com/chenhunghan/flare-operator
      org.opencontainers.image.licenses: Apache-2.0
  - id: flarefake
    ids: [flarefake]
    dockerfile: hack/release/Dockerfile.flarefake
    images: ["{{ .Env.IMAGE_REGISTRY }}/flarefake"]
    tags: ["{{ .Version }}", "{{ if not .Prerelease }}latest{{ end }}"]
    platforms: [linux/amd64, linux/arm64]
    sbom: true
    extra_files:
      - spec/openapi.json.gz
      - spec/LOCK
      - spec/LICENSE
    labels:
      org.opencontainers.image.title: flarefake
      org.opencontainers.image.description: Cloudflare API emulator for flare-operator e2e tests
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .CommitDate }}"
      org.opencontainers.image.base.name: gcr.io/distroless/static-debian12:nonroot
      org.opencontainers.image.source: https://github.com/chenhunghan/flare-operator
      org.opencontainers.image.licenses: Apache-2.0

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot.{{ .ShortCommit }}"

# CHANGELOG.md is written by hand.
changelog:
  disable: true

release:
  github:
    owner: chenhunghan
    name: flare-operator
  # A vX.Y.Z-rc.N tag is published as a pre-release (and does not move :latest).
  prerelease: auto
  extra_files:
    - glob: bin/chart/*.tgz
