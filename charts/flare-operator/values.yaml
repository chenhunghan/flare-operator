# Default values for flare-operator. values.schema.json validates them (helm install/upgrade/
# lint/template fail on an unknown key or a wrong type); update it with any change here.

# -- Override the chart name used in resource names.
nameOverride: ""
# -- Override the full resource name prefix (default: <release>-<chart>, or <release> if it already contains the chart name).
fullnameOverride: ""

image:
  # -- Manager image repository. Build it with `make docker-build`.
  repository: flare-operator
  # -- Image tag (default: the chart appVersion).
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# -- Manager replicas. More than one requires leaderElection.enabled.
replicas: 1

leaderElection:
  # -- Run the manager with --leader-elect. The lease lives in the release namespace.
  enabled: true

# -- Cluster identity written into ownership tags (flare.dev/owner=<clusterName>/<ns>/<name>).
# Required, and empty by default so an install that omits it fails: two clusters with the same
# name that manage the same Cloudflare account would adopt, overwrite and delete each other's
# resources. Give every cluster that manages the same Cloudflare account a distinct name.
clusterName: ""

# -- Tag managed Cloudflare resources with flare.dev/owner through Resource Tagging (--ownership-tags).
ownershipTags: true

# -- User-Agent for Cloudflare API calls (empty: the binary default, "flare-operator").
userAgent: ""

# -- Run only these controllers (--controller, repeatable). Empty runs every registered controller.
controllers: []

# CloudflareAccount spec.baseURL overrides. Both are off by default: an override sends the
# account's API token to that URL.
baseURLOverride:
  # -- Honour any spec.baseURL (--allow-base-url-override). Test clusters only.
  allowAny: false
  # -- Honour exactly these spec.baseURL values (--allowed-base-url, repeatable).
  allowed: []

# Reconcile tuning (docs/resilience.md has the API-call budget behind these numbers).
reconcile:
  # -- Drift-poll interval of managed objects (--poll-interval, minimum 10s). Empty keeps the
  # controller defaults (5m generated kinds, 10m Tunnel/VPCService/WorkerScript). Each poll
  # costs about 2 Cloudflare API calls per object, against a budget of 1200 per 5 minutes per token.
  pollInterval: ""
  # -- Parallel reconciles per controller (--max-concurrent-reconciles).
  maxConcurrentReconciles: 1
  # -- Context deadline of one reconcile (--reconcile-timeout).
  timeout: 5m
  # -- Timeout of one Cloudflare API HTTP request (--cloudflare-request-timeout).
  cloudflareRequestTimeout: 60s

logging:
  # -- zap log level: debug, info, error, or an integer verbosity.
  level: info
  # -- zap encoder: json or console.
  encoder: json

# -- Extra command-line arguments for the manager.
extraArgs: []
# -- Extra environment variables for the manager container.
extraEnv: []

metrics:
  # -- Serve Prometheus metrics (--metrics-bind-address); "0" disables when false. The
  # endpoint is plain HTTP without authentication (controller-runtime's default); restrict
  # who can reach it with networkPolicy.metricsFrom.
  enabled: true
  port: 8080
  service:
    # -- Create a ClusterIP Service for the metrics endpoint.
    enabled: true
    annotations: {}
  # A prometheus-operator ServiceMonitor for the metrics Service. Needs the
  # monitoring.coreos.com/v1 CRDs in the cluster, and metrics.service.enabled.
  serviceMonitor:
    enabled: false
    # -- Extra labels, e.g. the release label your Prometheus selects ServiceMonitors by.
    labels: {}
    annotations: {}
    # -- Scrape interval (empty: Prometheus' default).
    interval: ""
    scrapeTimeout: ""
    relabelings: []
    metricRelabelings: []

probes:
  # -- Health (/healthz) and readiness (/readyz) port (--health-probe-bind-address).
  port: 8081

serviceAccount:
  create: true
  # -- ServiceAccount name (default: the full name).
  name: ""
  annotations: {}

rbac:
  # -- Create the manager ClusterRole/Binding and the leader-election Role/Binding.
  create: true
  # -- Create ClusterRoles that aggregate flare-operator resources into the default view/edit/admin roles.
  aggregateToDefaultRoles: true

podAnnotations: {}
podLabels: {}
# -- PriorityClass for the manager pods (e.g. a class above your workloads so the operator is
# not preempted first).
priorityClassName: ""

# -- topologySpreadConstraints for the manager pods. An entry without labelSelector gets the
# manager's selector labels, e.g.
#   - maxSkew: 1
#     topologyKey: topology.kubernetes.io/zone
#     whenUnsatisfiable: ScheduleAnyway
topologySpreadConstraints: []

# A PodDisruptionBudget for the manager. It is rendered only when replicas > 1: with one
# replica a minAvailable 1 budget would block every node drain, and the standby replica is
# what makes a voluntary disruption harmless (the lease moves in about a second, because the
# manager releases it on shutdown).
podDisruptionBudget:
  enabled: true
  # -- minAvailable (integer or percentage). Ignored when maxUnavailable is set.
  minAvailable: 1
  # -- maxUnavailable (integer or percentage); empty uses minAvailable.
  maxUnavailable: ""

# A NetworkPolicy that limits the manager pods to the traffic they need. Off by default:
# plain NetworkPolicy matches IP blocks, not host names, so it needs the API server endpoint
# addresses of your cluster. See docs/operations.md "Network policy".
networkPolicy:
  enabled: false
  # Egress to the Kubernetes API server. NetworkPolicy sees the API server's endpoint
  # addresses (after the Service DNAT), not the kubernetes Service ClusterIP, so list the
  # endpoints: kubectl get endpointslices -n default -l kubernetes.io/service-name=kubernetes
  apiServer:
    # -- Required when enabled, e.g. ["192.168.5.15/32"].
    cidrs: []
    ports: [6443]
  # Egress to api.cloudflare.com:443. Plain NetworkPolicy cannot match a host name, so the
  # default allows HTTPS to all of Cloudflare's published ranges (DOCS:
  # https://www.cloudflare.com/ips/, fetched 2026-09-29), which api.cloudflare.com resolves
  # into. With a CNI that supports FQDN policies (Cilium toFQDNs, Calico domain names), set
  # cidrs: [] and add an FQDN rule through extraEgress or your CNI's own policy kind.
  cloudflareAPI:
    cidrs:
      - 173.245.48.0/20
      - 103.21.244.0/22
      - 103.22.200.0/22
      - 103.31.4.0/22
      - 141.101.64.0/18
      - 108.162.192.0/18
      - 190.93.240.0/20
      - 188.114.96.0/20
      - 197.234.240.0/22
      - 198.41.128.0/17
      - 162.158.0.0/15
      - 104.16.0.0/13
      - 104.24.0.0/14
      - 172.64.0.0/13
      - 131.0.72.0/22
      - 2400:cb00::/32
      - 2606:4700::/32
      - 2803:f800::/32
      - 2405:b500::/32
      - 2405:8100::/32
      - 2a06:98c0::/29
      - 2c0f:f248::/32
    ports: [443]
  # Egress to cluster DNS (UDP and TCP 53).
  dns:
    namespaceSelector:
      kubernetes.io/metadata.name: kube-system
    podSelector:
      k8s-app: kube-dns
  # -- Peers (NetworkPolicyPeer list) allowed to scrape the metrics port; empty allows any
  # source. Health probes come from the kubelet on the node, which NetworkPolicy always allows.
  metricsFrom: []
  # -- Extra egress rules (NetworkPolicyEgressRule list), e.g. a spec.baseURL override target.
  extraEgress: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  capabilities:
    drop:
      - ALL

# The manager caches Secrets cluster-wide (CloudflareAccount token refs); size memory for that.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}

# -- Kubernetes cluster DNS domain, used to build the flarefake Service URL.
clusterDomain: cluster.local

# flarefake: the Cloudflare API emulator (cmd/flarefake), for e2e tests. Never enable it in a
# cluster that manages a real Cloudflare account. When enabled, the manager gets
# --allowed-base-url for this Service's URL only (http://<fullname>-flarefake.<ns>.svc[.<clusterDomain>]:<port>/client/v4).
flarefake:
  enabled: false
  image:
    # -- flarefake image repository. Build it with `make docker-build-fake`.
    repository: flarefake
    # -- Image tag (default: the chart appVersion).
    tag: ""
    pullPolicy: IfNotPresent
  port: 8787
  # -- Validate requests against the pinned OpenAPI spec baked into the image (-spec).
  validateRequests: true
  # -- Answer schema-invalid requests with 400 instead of only journaling them.
  rejectSchemaViolations: false
  extraArgs: []
  podAnnotations: {}
  # The parsed 26 MB spec keeps an idle flarefake at ~320 MiB (measured on linux/arm64).
  resources:
    requests:
      cpu: 50m
      memory: 384Mi
    limits:
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
