---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
    controller-gen.kubebuilder.io/version: v0.22.0
  name: workerscripts.workers.cloudflare.flare.dev
spec:
  group: workers.cloudflare.flare.dev
  names:
    categories:
    - cloudflare
    - managed
    - workers
    kind: WorkerScript
    listKind: WorkerScriptList
    plural: workerscripts
    shortNames:
    - cfworker
    - cfscript
    singular: workerscript
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - description: The Cloudflare script name
      jsonPath: .status.id
      name: EXTERNAL-ID
      type: string
    - jsonPath: .status.atProvider.url
      name: URL
      type: string
    - jsonPath: .status.atProvider.version_id
      name: VERSION
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          WorkerScript is a Cloudflare Workers script (x-fern-sdk-group-name "workers.legacy.scripts").

          Uploaded to /accounts/{account_id}/workers/scripts/{script_name} (account scope). Every
          upload creates a new version and deploys it at 100%. Default deletion policy: Delete (a script
          is code, not data).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: WorkerScriptSpec defines the desired state of a WorkerScript.
            properties:
              accountRef:
                description: AccountRef names the CloudflareAccount (same namespace)
                  to use.
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              deletionPolicy:
                description: DeletionPolicy defaults per kind (Orphan for data-bearing
                  kinds).
                enum:
                - Delete
                - Orphan
                type: string
              forProvider:
                description: ForProvider is the script (optional for an observe-only
                  object).
                properties:
                  assets:
                    description: |-
                      Assets are static assets served with (or, without main_module, instead of) the Worker's
                      code. An assets binding (type assets) lets the code fetch them.
                    properties:
                      config:
                        description: Config of how the assets are served.
                        properties:
                          base_path:
                            description: 'BasePath is the URL path prefix the assets
                              are served under (Cloudflare''s default: /).'
                            maxLength: 1024
                            pattern: ^/
                            type: string
                          html_handling:
                            description: |-
                              HTMLHandling decides the redirects and rewrites of requests for HTML content (Cloudflare's
                              default: auto-trailing-slash).
                            enum:
                            - auto-trailing-slash
                            - force-trailing-slash
                            - drop-trailing-slash
                            - none
                            type: string
                          not_found_handling:
                            description: |-
                              NotFoundHandling decides the answer to a request that matches no asset when the Worker
                              does not run (Cloudflare's default: none, a 404).
                            enum:
                            - none
                            - 404-page
                            - single-page-application
                            type: string
                          run_worker_first:
                            description: |-
                              RunWorkerFirst true runs the Worker's code before every request, even one that matches an
                              asset (the code can serve assets through an assets binding). Needs modules.
                            type: boolean
                          run_worker_first_paths:
                            description: |-
                              RunWorkerFirstPaths runs the Worker's code first only for requests matching these rules
                              (sent as run_worker_first's list form): each starts with "/" or "!/" (a negative rule,
                              which wins), "*" is a glob, and at least one rule is not negative. Needs modules.
                            items:
                              maxLength: 1024
                              pattern: ^!?/
                              type: string
                            maxItems: 100
                            minItems: 1
                            type: array
                            x-kubernetes-list-type: atomic
                            x-kubernetes-validations:
                            - message: run_worker_first_paths needs at least one rule
                                that is not negative
                              rule: self.exists(r, !r.startsWith('!'))
                        type: object
                        x-kubernetes-validations:
                        - message: set run_worker_first or run_worker_first_paths,
                            not both
                          rule: '!(has(self.run_worker_first) && has(self.run_worker_first_paths))'
                      source:
                        description: Source of the files. A change of their content
                          uploads the new and changed files only.
                        properties:
                          configMapRef:
                            description: |-
                              ConfigMapRef takes the files from one or more ConfigMaps in the object's namespace. Each
                              ConfigMap must carry the label cloudflare.flare.dev/artifact=true. A ConfigMap holds at
                              most 1 MiB (data and binaryData together), so larger artifacts belong in ociRef or url.
                            properties:
                              configMaps:
                                description: ConfigMaps in the object's namespace,
                                  each labelled cloudflare.flare.dev/artifact=true.
                                items:
                                  description: |-
                                    ConfigMapArtifact is one ConfigMap of an artifact. Every key of data and binaryData is a file
                                    (text keys as their UTF-8 bytes, binaryData keys as their bytes). ConfigMap keys cannot hold
                                    "/", so path places the keys in a directory and items maps single keys to nested paths.
                                  properties:
                                    items:
                                      description: |-
                                        Items selects keys and gives each its own path (relative to path). When set, only the
                                        listed keys are used and each must exist; when empty, every key is a file named after it.
                                      items:
                                        description: ArtifactKeyToPath maps one ConfigMap
                                          key to a file path.
                                        properties:
                                          key:
                                            description: Key of the ConfigMap (data
                                              or binaryData).
                                            maxLength: 253
                                            minLength: 1
                                            type: string
                                          path:
                                            description: |-
                                              Path of the file, relative to the ConfigMap's path. Slash-separated; no "." or ".."
                                              segments, no leading "/".
                                            maxLength: 1024
                                            minLength: 1
                                            pattern: ^([^/\\.][^/\\]*|\.[^/\\.][^/\\]*|\.\.[^/\\]+)(/([^/\\.][^/\\]*|\.[^/\\.][^/\\]*|\.\.[^/\\]+))*$
                                            type: string
                                        required:
                                        - key
                                        - path
                                        type: object
                                      maxItems: 256
                                      type: array
                                      x-kubernetes-list-type: atomic
                                    name:
                                      description: Name of the ConfigMap.
                                      maxLength: 253
                                      minLength: 1
                                      type: string
                                    path:
                                      description: |-
                                        Path is the directory, relative to the artifact root, that this ConfigMap's files are
                                        placed in (default: the root). Slash-separated; no "." or ".." segments, no leading "/".
                                      maxLength: 1024
                                      pattern: ^([^/\\.][^/\\]*|\.[^/\\.][^/\\]*|\.\.[^/\\]+)(/([^/\\.][^/\\]*|\.[^/\\.][^/\\]*|\.\.[^/\\]+))*$
                                      type: string
                                  required:
                                  - name
                                  type: object
                                maxItems: 64
                                minItems: 1
                                type: array
                                x-kubernetes-list-type: atomic
                            required:
                            - configMaps
                            type: object
                          ociRef:
                            description: |-
                              OCIRef takes the files from the layers of an OCI image (e.g. one built FROM scratch with
                              the site's files). Pin it by digest: a tag is resolved again on every sync, and the digest
                              it resolved to is reported in status.
                            properties:
                              image:
                                description: |-
                                  Image is the reference: registry/repository[:tag][@sha256:<digest>]. Pinning by digest is
                                  recommended: the content then cannot change under the object, and a cached pull needs one
                                  manifest request per sync. The registry is always contacted over HTTPS.
                                maxLength: 1024
                                minLength: 1
                                type: string
                              path:
                                description: |-
                                  Path is the directory of the image's filesystem that becomes the artifact root (default:
                                  the image root). Slash-separated; no "." or ".." segments, no leading "/".
                                maxLength: 1024
                                pattern: ^([^/\\.][^/\\]*|\.[^/\\.][^/\\]*|\.\.[^/\\]+)(/([^/\\.][^/\\]*|\.[^/\\.][^/\\]*|\.\.[^/\\]+))*$
                                type: string
                              pullSecretRef:
                                description: |-
                                  PullSecretRef names a kubernetes.io/dockerconfigjson Secret in the object's namespace
                                  with the registry credentials. It must carry the label cloudflare.flare.dev/artifact=true.
                                  Without it the image is pulled anonymously.
                                properties:
                                  name:
                                    description: Name of the Secret.
                                    maxLength: 253
                                    minLength: 1
                                    type: string
                                required:
                                - name
                                type: object
                            required:
                            - image
                            type: object
                          url:
                            description: URL downloads a tar, tar.gz or zip archive
                              over HTTPS and checks its SHA-256.
                            properties:
                              path:
                                description: |-
                                  Path is the directory inside the archive that becomes the artifact root (default: the
                                  archive root). Slash-separated; no "." or ".." segments, no leading "/".
                                maxLength: 1024
                                pattern: ^([^/\\.][^/\\]*|\.[^/\\.][^/\\]*|\.\.[^/\\]+)(/([^/\\.][^/\\]*|\.[^/\\.][^/\\]*|\.\.[^/\\]+))*$
                                type: string
                              sha256:
                                description: SHA256 of the archive, lowercase hex.
                                  The download is rejected unless it matches.
                                pattern: ^[a-f0-9]{64}$
                                type: string
                              url:
                                description: URL of the archive (https only).
                                maxLength: 2048
                                minLength: 9
                                pattern: ^https://[^\s]+$
                                type: string
                            required:
                            - sha256
                            - url
                            type: object
                        type: object
                        x-kubernetes-validations:
                        - message: set exactly one of configMapRef, ociRef or url
                          rule: '(has(self.configMapRef) ? 1 : 0) + (has(self.ociRef)
                            ? 1 : 0) + (has(self.url) ? 1 : 0) == 1'
                    required:
                    - source
                    type: object
                  bindings:
                    description: Bindings of the script (env.<name>).
                    items:
                      description: |-
                        WorkerBinding is one entry of the script's bindings (metadata.bindings of the upload). Fields
                        named in snake_case are the API's; the camelCase *Ref fields name objects in this namespace
                        whose Cloudflare ID (or queue name) the controller fills in. A reference to an object that
                        is not Ready yet makes the WorkerScript Synced=False, reason DependencyNotReady, and nothing
                        is uploaded until it is.
                      properties:
                        allowed_destination_addresses:
                          description: |-
                            AllowedDestinationAddresses restricts a send_email binding to these destination addresses
                            (not together with destination_address).
                          items:
                            maxLength: 320
                            pattern: ^[^@\s]+@[^@\s]+$
                            type: string
                          maxItems: 100
                          type: array
                          x-kubernetes-list-type: set
                        allowed_sender_addresses:
                          description: AllowedSenderAddresses restricts the sender
                            addresses of a send_email binding.
                          items:
                            maxLength: 320
                            pattern: ^[^@\s]+@[^@\s]+$
                            type: string
                          maxItems: 100
                          type: array
                          x-kubernetes-list-type: set
                        bucket_name:
                          description: BucketName of an r2_bucket binding (the R2
                            bucket's name).
                          maxLength: 63
                          minLength: 3
                          pattern: ^[a-z0-9][a-z0-9-]*[a-z0-9]$
                          type: string
                        d1DatabaseRef:
                          description: D1DatabaseRef names a D1Database whose status.id
                            is the database_id.
                          properties:
                            name:
                              type: string
                          required:
                          - name
                          type: object
                        database_id:
                          description: DatabaseID of a d1 binding.
                          type: string
                        destination_address:
                          description: |-
                            DestinationAddress restricts a send_email binding to this one destination address. A
                            send_email binding needs Email Routing on a zone of the account, with the destination
                            addresses verified there; the operator does not check that.
                          maxLength: 320
                          pattern: ^[^@\s]+@[^@\s]+$
                          type: string
                        entrypoint:
                          description: Entrypoint of the bound Worker to invoke (service
                            bindings).
                          type: string
                        environment:
                          description: Environment of the bound Worker (service bindings).
                          type: string
                        json:
                          description: |-
                            JSON value of a json binding (required for, and only valid with, type json; checked by
                            the controller: CEL cannot see a schemaless field).
                          x-kubernetes-preserve-unknown-fields: true
                        jurisdiction:
                          description: |-
                            Jurisdiction of the R2 bucket of an r2_bucket binding (a bucket made in a jurisdiction is
                            found only with it).
                          enum:
                          - eu
                          - fedramp
                          - fedramp-high
                          - us
                          type: string
                        kvNamespaceRef:
                          description: KVNamespaceRef names a KVNamespace whose status.id
                            is the namespace_id.
                          properties:
                            name:
                              type: string
                          required:
                          - name
                          type: object
                        name:
                          description: Name is the JavaScript variable name of the
                            binding (env.<name>).
                          maxLength: 255
                          minLength: 1
                          type: string
                        namespace_id:
                          description: NamespaceID of a kv_namespace binding.
                          type: string
                        queue_name:
                          description: QueueName of a queue binding (queues are bound
                            by name).
                          type: string
                        queueRef:
                          description: QueueRef names a Queue whose queue name (status.atProvider.queue_name)
                            is bound.
                          properties:
                            name:
                              type: string
                          required:
                          - name
                          type: object
                        secretKeyRef:
                          description: |-
                            SecretKeyRef is the value of a secret_text binding. It is write-only in Cloudflare: a
                            change of the Secret's value is detected through status.writeOnlyHash. The Secret must
                            carry the label cloudflare.flare.dev/worker-binding=true (and not be a service account
                            token): the Worker's code can return the value, so only Secrets opted in for Workers are
                            read.
                          properties:
                            key:
                              description: Key in the Secret's data.
                              minLength: 1
                              type: string
                            name:
                              description: Name of the Secret.
                              minLength: 1
                              type: string
                          required:
                          - key
                          - name
                          type: object
                        service:
                          description: Service is the Worker script name of a service
                            binding.
                          type: string
                        service_id:
                          description: ServiceID of a vpc_service binding (a Workers
                            VPC service).
                          type: string
                        serviceRef:
                          description: ServiceRef names a WorkerScript whose script
                            name is bound.
                          properties:
                            name:
                              type: string
                          required:
                          - name
                          type: object
                        text:
                          description: Text of a plain_text binding.
                          type: string
                        type:
                          description: Type of the binding.
                          enum:
                          - plain_text
                          - secret_text
                          - json
                          - kv_namespace
                          - queue
                          - d1
                          - vpc_service
                          - service
                          - r2_bucket
                          - send_email
                          - assets
                          type: string
                        vpcServiceRef:
                          description: |-
                            VPCServiceRef names a VPCService whose status.id is the service_id. The VPCService cannot
                            finish deleting while this binding exists (Cloudflare does not check, 0091).
                          properties:
                            name:
                              type: string
                          required:
                          - name
                          type: object
                      required:
                      - name
                      - type
                      type: object
                      x-kubernetes-validations:
                      - message: a kvNamespaceRef, queueRef, d1DatabaseRef, vpcServiceRef
                          or serviceRef needs a non-empty name
                        rule: (!has(self.kvNamespaceRef) || size(self.kvNamespaceRef.name)
                          > 0) && (!has(self.queueRef) || size(self.queueRef.name)
                          > 0) && (!has(self.d1DatabaseRef) || size(self.d1DatabaseRef.name)
                          > 0) && (!has(self.vpcServiceRef) || size(self.vpcServiceRef.name)
                          > 0) && (!has(self.serviceRef) || size(self.serviceRef.name)
                          > 0)
                      - message: text is required for (and only valid with) type plain_text
                        rule: 'self.type == ''plain_text'' ? has(self.text) : !has(self.text)'
                      - message: secretKeyRef is required for (and only valid with)
                          type secret_text
                        rule: 'self.type == ''secret_text'' ? has(self.secretKeyRef)
                          : !has(self.secretKeyRef)'
                      - message: type kv_namespace needs exactly one of namespace_id
                          or kvNamespaceRef (only valid with that type)
                        rule: 'self.type == ''kv_namespace'' ? has(self.namespace_id)
                          != has(self.kvNamespaceRef) : !has(self.namespace_id) &&
                          !has(self.kvNamespaceRef)'
                      - message: type queue needs exactly one of queue_name or queueRef
                          (only valid with that type)
                        rule: 'self.type == ''queue'' ? has(self.queue_name) != has(self.queueRef)
                          : !has(self.queue_name) && !has(self.queueRef)'
                      - message: type d1 needs exactly one of database_id or d1DatabaseRef
                          (only valid with that type)
                        rule: 'self.type == ''d1'' ? has(self.database_id) != has(self.d1DatabaseRef)
                          : !has(self.database_id) && !has(self.d1DatabaseRef)'
                      - message: type vpc_service needs exactly one of service_id
                          or vpcServiceRef (only valid with that type)
                        rule: 'self.type == ''vpc_service'' ? has(self.service_id)
                          != has(self.vpcServiceRef) : !has(self.service_id) && !has(self.vpcServiceRef)'
                      - message: type service needs exactly one of service or serviceRef
                          (only valid with that type, as are environment and entrypoint)
                        rule: 'self.type == ''service'' ? has(self.service) != has(self.serviceRef)
                          : !has(self.service) && !has(self.serviceRef) && !has(self.environment)
                          && !has(self.entrypoint)'
                      - message: type r2_bucket needs bucket_name (only valid with
                          that type, as is jurisdiction)
                        rule: 'self.type == ''r2_bucket'' ? has(self.bucket_name)
                          : !has(self.bucket_name) && !has(self.jurisdiction)'
                      - message: destination_address, allowed_destination_addresses
                          and allowed_sender_addresses are only valid with type send_email
                        rule: self.type == 'send_email' || (!has(self.destination_address)
                          && !has(self.allowed_destination_addresses) && !has(self.allowed_sender_addresses))
                      - message: set destination_address or allowed_destination_addresses,
                          not both
                        rule: '!(has(self.destination_address) && has(self.allowed_destination_addresses))'
                    maxItems: 64
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  compatibility_date:
                    description: CompatibilityDate of the Workers runtime, e.g. 2026-09-01.
                    pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
                    type: string
                  compatibility_flags:
                    description: CompatibilityFlags of the Workers runtime, e.g. nodejs_compat.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  logpush:
                    description: Logpush enables Workers Trace Events Logpush for
                      the script.
                    type: boolean
                  main_module:
                    description: |-
                      MainModule is the module that exports the handlers (metadata.main_module). Required
                      unless the Worker is assets-only (assets, and no modules).
                    minLength: 1
                    type: string
                  moduleSource:
                    description: |-
                      ModuleSource takes the modules from an artifact (labelled ConfigMaps, an OCI image or an
                      HTTPS archive; docs/artifacts.md), for example a bundle built by CI. Every file is a
                      module named by its path; its type comes from moduleTypes, else from its extension: .js
                      and .mjs → esm, .cjs → cjs, .json → json, .wasm → wasm (raw bytes), .txt, .html, .htm,
                      .css, .md, .csv and .svg → text. A file of any other type is an error. At most 64
                      modules.
                    properties:
                      configMapRef:
                        description: |-
                          ConfigMapRef takes the files from one or more ConfigMaps in the object's namespace. Each
                          ConfigMap must carry the label cloudflare.flare.dev/artifact=true. A ConfigMap holds at
                          most 1 MiB (data and binaryData together), so larger artifacts belong in ociRef or url.
                        properties:
                          configMaps:
                            description: ConfigMaps in the object's namespace, each
                              labelled cloudflare.flare.dev/artifact=true.
                            items:
                              description: |-
                                ConfigMapArtifact is one ConfigMap of an artifact. Every key of data and binaryData is a file
                                (text keys as their UTF-8 bytes, binaryData keys as their bytes). ConfigMap keys cannot hold
                                "/", so path places the keys in a directory and items maps single keys to nested paths.
                              properties:
                                items:
                                  description: |-
                                    Items selects keys and gives each its own path (relative to path). When set, only the
                                    listed keys are used and each must exist; when empty, every key is a file named after it.
                                  items:
                                    description: ArtifactKeyToPath maps one ConfigMap
                                      key to a file path.
                                    properties:
                                      key:
                                        description: Key of the ConfigMap (data or
                                          binaryData).
                                        maxLength: 253
                                        minLength: 1
                                        type: string
                                      path:
                                        description: |-
                                          Path of the file, relative to the ConfigMap's path. Slash-separated; no "." or ".."
                                          segments, no leading "/".
                                        maxLength: 1024
                                        minLength: 1
                                        pattern: ^([^/\\.][^/\\]*|\.[^/\\.][^/\\]*|\.\.[^/\\]+)(/([^/\\.][^/\\]*|\.[^/\\.][^/\\]*|\.\.[^/\\]+))*$
                                        type: string
                                    required:
                                    - key
                                    - path
                                    type: object
                                  maxItems: 256
                                  type: array
                                  x-kubernetes-list-type: atomic
                                name:
                                  description: Name of the ConfigMap.
                                  maxLength: 253
                                  minLength: 1
                                  type: string
                                path:
                                  description: |-
                                    Path is the directory, relative to the artifact root, that this ConfigMap's files are
                                    placed in (default: the root). Slash-separated; no "." or ".." segments, no leading "/".
                                  maxLength: 1024
                                  pattern: ^([^/\\.][^/\\]*|\.[^/\\.][^/\\]*|\.\.[^/\\]+)(/([^/\\.][^/\\]*|\.[^/\\.][^/\\]*|\.\.[^/\\]+))*$
                                  type: string
                              required:
                              - name
                              type: object
                            maxItems: 64
                            minItems: 1
                            type: array
                            x-kubernetes-list-type: atomic
                        required:
                        - configMaps
                        type: object
                      ociRef:
                        description: |-
                          OCIRef takes the files from the layers of an OCI image (e.g. one built FROM scratch with
                          the site's files). Pin it by digest: a tag is resolved again on every sync, and the digest
                          it resolved to is reported in status.
                        properties:
                          image:
                            description: |-
                              Image is the reference: registry/repository[:tag][@sha256:<digest>]. Pinning by digest is
                              recommended: the content then cannot change under the object, and a cached pull needs one
                              manifest request per sync. The registry is always contacted over HTTPS.
                            maxLength: 1024
                            minLength: 1
                            type: string
                          path:
                            description: |-
                              Path is the directory of the image's filesystem that becomes the artifact root (default:
                              the image root). Slash-separated; no "." or ".." segments, no leading "/".
                            maxLength: 1024
                            pattern: ^([^/\\.][^/\\]*|\.[^/\\.][^/\\]*|\.\.[^/\\]+)(/([^/\\.][^/\\]*|\.[^/\\.][^/\\]*|\.\.[^/\\]+))*$
                            type: string
                          pullSecretRef:
                            description: |-
                              PullSecretRef names a kubernetes.io/dockerconfigjson Secret in the object's namespace
                              with the registry credentials. It must carry the label cloudflare.flare.dev/artifact=true.
                              Without it the image is pulled anonymously.
                            properties:
                              name:
                                description: Name of the Secret.
                                maxLength: 253
                                minLength: 1
                                type: string
                            required:
                            - name
                            type: object
                        required:
                        - image
                        type: object
                      url:
                        description: URL downloads a tar, tar.gz or zip archive over
                          HTTPS and checks its SHA-256.
                        properties:
                          path:
                            description: |-
                              Path is the directory inside the archive that becomes the artifact root (default: the
                              archive root). Slash-separated; no "." or ".." segments, no leading "/".
                            maxLength: 1024
                            pattern: ^([^/\\.][^/\\]*|\.[^/\\.][^/\\]*|\.\.[^/\\]+)(/([^/\\.][^/\\]*|\.[^/\\.][^/\\]*|\.\.[^/\\]+))*$
                            type: string
                          sha256:
                            description: SHA256 of the archive, lowercase hex. The
                              download is rejected unless it matches.
                            pattern: ^[a-f0-9]{64}$
                            type: string
                          url:
                            description: URL of the archive (https only).
                            maxLength: 2048
                            minLength: 9
