{{- /*
Rendered only with more than one replica: a minAvailable 1 budget over a single replica would
block every node drain (see values.yaml podDisruptionBudget).
*/}}
{{- if and .Values.podDisruptionBudget.enabled (gt (int .Values.replicas) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "flare-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flare-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: manager
spec:
  {{- if not (eq (toString .Values.podDisruptionBudget.maxUnavailable) "") }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- else }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "flare-operator.selectorLabels" . | nindent 6 }}
{{- end }}
