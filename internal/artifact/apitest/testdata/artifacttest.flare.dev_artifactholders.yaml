---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: artifactholders.artifacttest.flare.dev
spec:
  group: artifacttest.flare.dev
  names:
    kind: ArtifactHolder
    listKind: ArtifactHolderList
    plural: artifactholders
    singular: artifactholder
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: ArtifactHolder is a test-only kind.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ArtifactHolderSpec embeds an ArtifactSource.
            properties:
              source:
                description: |-
                  ArtifactSource says where the files of a deployable artifact come from. Exactly one of
                  configMapRef, ociRef or url is set. The loader (internal/artifact) turns it into an in-memory
                  file tree (path → bytes) with a content digest, within the size and file-count limits of the
                  manager flags --artifact-max-*.
                properties:
                  configMapRef:
                    description: |-
                      ConfigMapRef takes the files from one or more ConfigMaps in the object's namespace. Each
                      ConfigMap must carry the label cloudflare.flare.dev/artifact=true. A ConfigMap holds at
                      most 1 MiB (data and binaryData together), so larger artifacts belong in ociRef or url.
                    properties:
                      configMaps:
                        description: ConfigMaps in the object's namespace, each labelled
                          cloudflare.flare.dev/artifact=true.
                        items:
                          description: |-
                            ConfigMapArtifact is one ConfigMap of an artifact. Every key of data and binaryData is a file
                            (text keys as their UTF-8 bytes, binaryData keys as their bytes). ConfigMap keys cannot hold
                            "/", so path places the keys in a directory and items maps single keys to nested paths.
                          properties:
                            items:
                              description: |-
                                Items selects keys and gives each its own path (relative to path). When set, only the
                                listed keys are used and each must exist; when empty, every key is a file named after it.
                              items:
                                description: ArtifactKeyToPath maps one ConfigMap
                                  key to a file path.
                                properties:
                                  key:
                                    description: Key of the ConfigMap (data or binaryData).
                                    maxLength: 253
                                    minLength: 1
                                    type: string
                                  path:
                                    description: |-
                                      Path of the file, relative to the ConfigMap's path. Slash-separated; no "." or ".."
                                      segments, no leading "/".
                                    maxLength: 1024
                                    minLength: 1
                                    pattern: ^([^/\\.][^/\\]*|\.[^/\\.][^/\\]*|\.\.[^/\\]+)(/([^/\\.][^/\\]*|\.[^/\\.][^/\\]*|\.\.[^/\\]+))*$
                                    type: string
                                required:
                                - key
                                - path
                                type: object
                              maxItems: 256
                              type: array
                              x-kubernetes-list-type: atomic
                            name:
                              description: Name of the ConfigMap.
                              maxLength: 253
                              minLength: 1
                              type: string
                            path:
                              description: |-
                                Path is the directory, relative to the artifact root, that this ConfigMap's files are
                                placed in (default: the root). Slash-separated; no "." or ".." segments, no leading "/".
                              maxLength: 1024
                              pattern: ^([^/\\.][^/\\]*|\.[^/\\.][^/\\]*|\.\.[^/\\]+)(/([^/\\.][^/\\]*|\.[^/\\.][^/\\]*|\.\.[^/\\]+))*$
                              type: string
                          required:
                          - name
                          type: object
                        maxItems: 64
                        minItems: 1
                        type: array
                        x-kubernetes-list-type: atomic
                    required:
                    - configMaps
                    type: object
                  ociRef:
                    description: |-
                      OCIRef takes the files from the layers of an OCI image (e.g. one built FROM scratch with
                      the site's files). Pin it by digest: a tag is resolved again on every sync, and the digest
                      it resolved to is reported in status.
                    properties:
                      image:
                        description: |-
                          Image is the reference: registry/repository[:tag][@sha256:<digest>]. Pinning by digest is
                          recommended: the content then cannot change under the object, and a cached pull needs one
                          manifest request per sync. The registry is always contacted over HTTPS.
                        maxLength: 1024
                        minLength: 1
                        type: string
                      path:
                        description: |-
                          Path is the directory of the image's filesystem that becomes the artifact root (default:
                          the image root). Slash-separated; no "." or ".." segments, no leading "/".
                        maxLength: 1024
                        pattern: ^([^/\\.][^/\\]*|\.[^/\\.][^/\\]*|\.\.[^/\\]+)(/([^/\\.][^/\\]*|\.[^/\\.][^/\\]*|\.\.[^/\\]+))*$
                        type: string
                      pullSecretRef:
                        description: |-
                          PullSecretRef names a kubernetes.io/dockerconfigjson Secret in the object's namespace
                          with the registry credentials. It must carry the label cloudflare.flare.dev/artifact=true.
                          Without it the image is pulled anonymously.
                        properties:
                          name:
                            description: Name of the Secret.
                            maxLength: 253
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                    required:
                    - image
                    type: object
                  url:
                    description: URL downloads a tar, tar.gz or zip archive over HTTPS
                      and checks its SHA-256.
                    properties:
                      path:
                        description: |-
                          Path is the directory inside the archive that becomes the artifact root (default: the
                          archive root). Slash-separated; no "." or ".." segments, no leading "/".
                        maxLength: 1024
                        pattern: ^([^/\\.][^/\\]*|\.[^/\\.][^/\\]*|\.\.[^/\\]+)(/([^/\\.][^/\\]*|\.[^/\\.][^/\\]*|\.\.[^/\\]+))*$
                        type: string
                      sha256:
                        description: SHA256 of the archive, lowercase hex. The download
                          is rejected unless it matches.
                        pattern: ^[a-f0-9]{64}$
                        type: string
                      url:
                        description: URL of the archive (https only).
                        maxLength: 2048
                        minLength: 9
                        pattern: ^https://[^\s]+$
                        type: string
                    required:
                    - sha256
                    - url
                    type: object
                type: object
                x-kubernetes-validations:
                - message: set exactly one of configMapRef, ociRef or url
                  rule: '(has(self.configMapRef) ? 1 : 0) + (has(self.ociRef) ? 1
                    : 0) + (has(self.url) ? 1 : 0) == 1'
            required:
            - source
            type: object
          status:
            description: ArtifactHolderStatus embeds an ArtifactStatus.
            properties:
              artifact:
                description: ArtifactStatus is what a kind reports about the artifact
                  it last loaded.
                properties:
                  bytes:
                    description: Bytes is the total size of the files.
                    format: int64
                    type: integer
                  digest:
                    description: |-
                      Digest of the file tree ("sha256:<hex>" over the sorted paths and contents); the same
                      files give the same digest whatever the source.
                    type: string
                  files:
                    description: Files is the number of files in the tree.
                    format: int32
                    type: integer
                  resolvedDigest:
                    description: |-
                      ResolvedDigest is the manifest digest an ociRef resolved to (the digest of its tag at the
                      last sync, or the pinned digest).
                    type: string
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
