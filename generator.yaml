# cmd/flaregen input: which Cloudflare resources become CRD kinds.
#
# Each entry names a resource of the model by its x-fern-sdk-group-name
# (and `path` when the group holds several). Everything else is derived from
# the pinned spec (internal/flaregen/doc.go); overrides here must say why,
# citing a recording (test/recordings/2026-09-29/NNNN) or marking UNVERIFIED.
#
# Regenerate with `make generate-crds`; TestGeneratedUpToDate fails otherwise.
#
# kubectl UX (docs/api-reference.md): every kind gets the columns READY, SYNCED, EXTERNAL-ID,
# its printColumns, then AGE, and the categories cloudflare, managed and its product.
# shortNames all start with "cf" so they cannot collide with core Kubernetes short names
# (po, svc, ns, ...) or those of common CRDs (cert-manager, Kueue's "queue", ...).
version: v1alpha1
groupSuffix: cloudflare.flare.dev
kinds:
  - fernGroup: kv.namespaces
    kind: KVNamespace
    shortNames: [cfkv]
    printColumns:
      - {name: TITLE, type: string, jsonPath: .status.atProvider.title}
    defaultDeletionPolicy: Orphan
    tagResourceType: kv_namespace
    listOrder: "id ascending by default; order=title and direction=asc|desc supported"
    why:
      kind: '"Namespace" alone would clash with the core kind in kubectl output'
      defaultDeletionPolicy: data-bearing (keys and values)
      tagResourceType: "resource_type enum of the spec's tags-set; UNVERIFIED against live Resource Tagging"
      listOrder: kv-order-list-default, kv-order-list-title-asc, 0007/0008
      derived: "id/title from the get response (0006); rename is PUT (0009); jurisdiction is create-only"

  - fernGroup: queues
    kind: Queue
    shortNames: [cfqueue, cfq]
    printColumns:
      - {name: QUEUE, type: string, jsonPath: .status.atProvider.queue_name}
      - {name: CONSUMERS, type: number, jsonPath: .status.atProvider.consumers_total_count, priority: 1}
    defaultDeletionPolicy: Orphan
    tagResourceType: queue
    immutable: [jurisdiction]
    writeOnly: [settings.delivery_paused]
    fields:
      settings.delivery_delay: {type: integer}
      settings.message_retention_period: {type: integer}
    why:
      defaultDeletionPolicy: data-bearing (undelivered messages)
      tagResourceType: "resource_type enum of the spec's tags-set; UNVERIFIED against live Resource Tagging"
      immutable: "UNVERIFIED: the spec lists jurisdiction in the PUT/PATCH bodies, but a queue's jurisdiction is fixed at creation"
      jurisdiction: "read back from GET (atProvider.jurisdiction per the spec). No recording creates a queue with a jurisdiction (0028 has none and returns none); flarefake stores and returns it when set (UNVERIFIED)"
      fields: "spec says number; the API returns and accepts whole seconds (0028, 0032, 0033)"
      writeOnly: "the spec returns settings.delivery_paused, but the create, GET and PATCH results omit it (0028, 0031, 0032: settings hold only delivery_delay and message_retention_period; none of them sets it), so drift is detected via status.writeOnlyHash. Whether GET returns it once set is UNVERIFIED"
      derived: "id field queue_id (0028); PATCH merges settings (0032) and is preferred over PUT, which resets omitted settings (0033)"

  - fernGroup: d1
    path: /accounts/{account_id}/d1/database
    kind: D1Database
    shortNames: [cfd1]
    printColumns:
      - {name: DATABASE, type: string, jsonPath: .status.atProvider.name}
      - {name: VERSION, type: string, jsonPath: .status.atProvider.version, priority: 1}
    defaultDeletionPolicy: Orphan
    tagResourceType: d1_database
    fields:
      primary_location_hint: {enum: [WNAM, ENAM, WEUR, EEUR, APAC, OC]}
    why:
      kind: '"Database" is too generic across groups'
      defaultDeletionPolicy: data-bearing (SQL data)
      tagResourceType: "resource_type enum of the spec's tags-set; UNVERIFIED against live Resource Tagging"
      fields: "spec enum is lower-case; the API rejects other values and names the upper-case set (0019)"
      derived: "id field uuid (0017); PATCH read_replication (0023); name/jurisdiction/primary_location_hint are create-only; primary_location_hint is never read back (0020), so it is write-only"


  # Proving wave for the generic flarefake profile (docs/generator-scaleout.md): simple
  # account-level CRUD resources with plain JSON bodies, emulated only by the generic profile
  # (emulate: generic) until a live recording pass replaces its UNVERIFIED behavior.
  - fernGroup: vectorize
    kind: VectorizeIndex
    shortNames: [cfvec]
    printColumns:
      - {name: DIMENSIONS, type: integer, jsonPath: .status.atProvider.config.dimensions}
      - {name: METRIC, type: string, jsonPath: .status.atProvider.config.metric}
    idField: name
    emulate: generic
    writeOnly: [config.preset]
    why:
      kind: '"Index" alone is too generic across groups'
      idField: "the item path takes the index name ({index_name}); the object has no other identifier (spec)"
      writeOnly: "the create body's config is a oneOf of {dimensions, metric} and {preset}, but the GET result's config is vectorize_index-dimension-configuration ({dimensions, metric}, both required): a preset is never read back (spec; UNVERIFIED against the live API), so it is compared through status.writeOnlyHash"
      emulate: "no hand-written profile; the empty list 0154 matches the spec (no result_info)"
      derived: "no update operation in the v2 API: every field is create-only (immutable)"

  - fernGroup: secrets-store.stores
    kind: SecretsStore
    shortNames: [cfstore]
    printColumns:
      - {name: STORE, type: string, jsonPath: .status.atProvider.name}
    group: secretsstore
    emulate: generic
    why:
      kind: '"Store" alone is too generic across groups'
      group: '"secrets-store" is not a valid Go package name'
      emulate: "no hand-written profile; list result_info recorded without total_pages (0155, a generic quirk)"
      derived: "no update operation: name is create-only (immutable). UNVERIFIED: the beta allows one store per account, which the generic profile does not enforce"

  - fernGroup: ai-gateway.gateways
    kind: AIGateway
    shortNames: [cfaigw]
    printColumns:
      - {name: COLLECT-LOGS, type: boolean, jsonPath: .status.atProvider.collect_logs}
      - {name: CACHE-TTL, type: integer, jsonPath: .status.atProvider.cache_ttl, priority: 1}
    group: aigateway
    emulate: generic
    why:
      group: '"ai-gateway" is not a valid Go package name'
      emulate: "no hand-written profile and no recordings yet"
      derived: "the client chooses the id (create body); PUT is the only update, so id is create-only (immutable); no name field, so no adoption by name"
