# An AI Gateway gateway. Emulated by flarefake's generic profile (UNVERIFIED; see
# docs/generator-scaleout.md). The client chooses the id (create-only); the rest is updated
# with PUT. There is no name field. AIGateway has no owner tag, so an existing gateway with this
# id is not adopted: the object reports NameConflict until the flare.dev/external-id
# annotation pins it. A pinned gateway is deleted with the object under the default
# deletionPolicy Delete; set deletionPolicy: Orphan to keep it.
apiVersion: flare.dev/v1alpha1
kind: AIGateway
metadata:
  name: app-gateway
spec:
  accountRef:
    name: main
  forProvider:
    id: app-gateway
    cache_invalidate_on_update: true
    cache_ttl: 300               # seconds
    collect_logs: true
    rate_limiting_interval: 60   # seconds
    rate_limiting_limit: 100
    rate_limiting_technique: sliding  # fixed | sliding
