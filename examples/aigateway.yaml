# An AI Gateway gateway. Emulated by flarefake's generic profile (UNVERIFIED; see
# docs/generator-scaleout.md). The client chooses the id (create-only); the rest is updated
# with PUT. There is no name field. Before creating, the operator looks up a gateway with this
# id and adopts it if it exists. AIGateway has no owner tag, so an adopted gateway is deleted
# with the object under the default deletionPolicy Delete; set deletionPolicy: Orphan to keep it.
apiVersion: aigateway.cloudflare.flare.dev/v1alpha1
kind: AIGateway
metadata:
  name: app-gateway
spec:
  accountRef:
    name: main
  forProvider:
    id: app-gateway
    cache_invalidate_on_update: true
    cache_ttl: 300               # seconds
    collect_logs: true
    rate_limiting_interval: 60   # seconds
    rate_limiting_limit: 100
    rate_limiting_technique: sliding  # fixed | sliding
