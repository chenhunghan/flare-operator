# The Worker's secret_text binding SESSION_SECRET (and the Pages variant's secret_text
# environment variable of the same name): the HMAC key that signs the session cookie.
#
# The label is required: the Worker's code could return a binding's value to anyone, so the
# operator only reads Secrets that are opted in for Workers. Replace the placeholder with a long
# random string, or create the Secret yourself and drop this file from the kustomization. The
# namespace must exist first:
#
#   kubectl apply -f examples/fullstack/namespace.yaml
#   kubectl -n flare-fullstack create secret generic notes-app-secrets \
#     --from-literal=session-secret="$(openssl rand -base64 32)"
#   kubectl -n flare-fullstack label secret notes-app-secrets flare.dev/worker-binding=true
#
# Cloudflare never returns the value; the operator uploads it again when the Secret changes.
apiVersion: v1
kind: Secret
metadata:
  name: notes-app-secrets
  labels:
    flare.dev/worker-binding: "true"
type: Opaque
stringData:
  session-secret: REPLACE-WITH-A-LONG-RANDOM-STRING
