# A Workers KV namespace. Default deletionPolicy: Orphan (the namespace holds data), so deleting
# this object keeps the namespace in Cloudflare unless deletionPolicy is Delete.
apiVersion: flare.dev/v1alpha1
kind: KVNamespace
metadata:
  name: sessions
spec:
  accountRef:
    name: main
  forProvider:
    title: sessions # renaming is an in-place update (PUT)
    # jurisdiction: eu # eu | fedramp | us; create-only (a later change reports Synced=False, Immutable)
---
# Observe-only: read an existing namespace into status.atProvider without ever writing to
# Cloudflare. The external-id annotation names the namespace ID; forProvider.title may be
# omitted because Create is not allowed.
apiVersion: flare.dev/v1alpha1
kind: KVNamespace
metadata:
  name: legacy-cache
  annotations:
    flare.dev/external-id: 0f2ac74b498b48028cb68387c421e279
spec:
  accountRef:
    name: main
  managementPolicies: ["Observe"]
  forProvider: {}
