# A Secrets Store store. Emulated by flarefake's generic profile (UNVERIFIED; see
# docs/generator-scaleout.md). No update operation: the name is create-only.
# Default deletionPolicy: Delete, although a store holds secrets: set Orphan to keep it when the
# object is deleted. SecretsStore has no owner tag, so an existing store with this name is not
# adopted: the object reports NameConflict until the flare.dev/external-id annotation
# pins the store's ID. A pinned store is deleted with the object under Delete.
apiVersion: flare.dev/v1alpha1
kind: SecretsStore
metadata:
  name: app-secrets
spec:
  accountRef:
    name: main
  deletionPolicy: Orphan
  forProvider:
    name: app-secrets
