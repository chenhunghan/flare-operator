# Release for a pushed v* tag (.goreleaser.yaml does the build):
#   - multi-arch images ghcr.io/chenhunghan/flare-operator and ghcr.io/chenhunghan/flarefake
#     (linux/amd64 + linux/arm64, SBOM attestations, OCI labels linking them to this repository);
#   - a GitHub release with the manager and flarefake archives, checksums, SBOMs and the chart .tgz;
#   - the Helm chart pushed as an OCI artifact to oci://ghcr.io/chenhunghan/charts/flare-operator.
# GHCR creates new packages as private: after the first release, make the flare-operator,
# flarefake and charts/flare-operator packages public once in their package settings.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # the GitHub release
  packages: write # GHCR images and the OCI chart

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CGO_ENABLED: "0"
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  release:
    name: goreleaser + chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # goreleaser reads the tags and the commit history.
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: azure/setup-helm@v4
        with:
          version: v4.0.4 # the helm the chart is linted with (ci.yml)
      # syft writes the SPDX SBOM of every archive (sboms: in .goreleaser.yaml).
      - uses: anchore/sbom-action/download-syft@v0
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: goreleaser release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The before hook of .goreleaser.yaml packaged the chart as bin/chart/flare-operator-<version>.tgz
      # (chart version = appVersion = the tag without its "v").
      - name: Push the chart to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          chart="bin/chart/flare-operator-${version}.tgz"
          test -f "$chart" || { echo "missing $chart"; ls -l bin/chart; exit 1; }
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          helm push "$chart" "$CHART_REPO"
