---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flare-operator-manager
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - services
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - flare.dev
  resources:
  - '*'
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - flare.dev
  resources:
  - aigateways
  - cloudflareaccounts
  - d1databases
  - kvnamespaces
  - pagesdeployments
  - pagesprojects
  - queues
  - r2buckets
  - secretsstores
  - tunnels
  - vectorizeindexes
  - vpcservices
  - workerscripts
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - flare.dev
  resources:
  - aigateways/finalizers
  - d1databases/finalizers
  - kvnamespaces/finalizers
  - pagesdeployments/finalizers
  - pagesprojects/finalizers
  - queues/finalizers
  - r2buckets/finalizers
  - secretsstores/finalizers
  - tunnels/finalizers
  - vectorizeindexes/finalizers
  - vpcservices/finalizers
  - workerscripts/finalizers
  verbs:
  - update
- apiGroups:
  - flare.dev
  resources:
  - aigateways/status
  - cloudflareaccounts/status
  - d1databases/status
  - kvnamespaces/status
  - pagesdeployments/status
  - pagesprojects/status
  - queues/status
  - r2buckets/status
  - secretsstores/status
  - tunnels/status
  - vectorizeindexes/status
  - vpcservices/status
  - workerscripts/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
