---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: workerscripts.workers.cloudflare.flare.dev
spec:
  group: workers.cloudflare.flare.dev
  names:
    categories:
    - cloudflare
    - managed
    - workers
    kind: WorkerScript
    listKind: WorkerScriptList
    plural: workerscripts
    shortNames:
    - cfworker
    - cfscript
    singular: workerscript
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - description: The Cloudflare script name
      jsonPath: .status.id
      name: EXTERNAL-ID
      type: string
    - jsonPath: .status.atProvider.url
      name: URL
      type: string
    - jsonPath: .status.atProvider.version_id
      name: VERSION
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          WorkerScript is a Cloudflare Workers script (x-fern-sdk-group-name "workers.legacy.scripts").

          Uploaded to /accounts/{account_id}/workers/scripts/{script_name} (account scope). Every
          upload creates a new version and deploys it at 100%. Default deletion policy: Delete (a script
          is code, not data).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: WorkerScriptSpec defines the desired state of a WorkerScript.
            properties:
              accountRef:
                description: AccountRef names the CloudflareAccount (same namespace)
                  to use.
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              deletionPolicy:
                description: DeletionPolicy defaults per kind (Orphan for data-bearing
                  kinds).
                enum:
                - Delete
                - Orphan
                type: string
              forProvider:
                description: ForProvider is the script (optional for an observe-only
                  object).
                properties:
                  bindings:
                    description: Bindings of the script (env.<name>).
                    items:
                      description: |-
                        WorkerBinding is one entry of the script's bindings (metadata.bindings of the upload). Fields
                        named in snake_case are the API's; the camelCase *Ref fields name objects in this namespace
                        whose Cloudflare ID (or queue name) the controller fills in. A reference to an object that
                        is not Ready yet makes the WorkerScript Synced=False, reason DependencyNotReady, and nothing
                        is uploaded until it is.
                      properties:
                        d1DatabaseRef:
                          description: D1DatabaseRef names a D1Database whose status.id
                            is the database_id.
                          properties:
                            name:
                              type: string
                          required:
                          - name
                          type: object
                        database_id:
                          description: DatabaseID of a d1 binding.
                          type: string
                        entrypoint:
                          description: Entrypoint of the bound Worker to invoke (service
                            bindings).
                          type: string
                        environment:
                          description: Environment of the bound Worker (service bindings).
                          type: string
                        json:
                          description: |-
                            JSON value of a json binding (required for, and only valid with, type json; checked by
                            the controller: CEL cannot see a schemaless field).
                          x-kubernetes-preserve-unknown-fields: true
                        kvNamespaceRef:
                          description: KVNamespaceRef names a KVNamespace whose status.id
                            is the namespace_id.
                          properties:
                            name:
                              type: string
                          required:
                          - name
                          type: object
                        name:
                          description: Name is the JavaScript variable name of the
                            binding (env.<name>).
                          maxLength: 255
                          minLength: 1
                          type: string
                        namespace_id:
                          description: NamespaceID of a kv_namespace binding.
                          type: string
                        queue_name:
                          description: QueueName of a queue binding (queues are bound
                            by name).
                          type: string
                        queueRef:
                          description: QueueRef names a Queue whose queue name (status.atProvider.queue_name)
                            is bound.
                          properties:
                            name:
                              type: string
                          required:
                          - name
                          type: object
                        secretKeyRef:
                          description: |-
                            SecretKeyRef is the value of a secret_text binding. It is write-only in Cloudflare: a
                            change of the Secret's value is detected through status.writeOnlyHash.
                          properties:
                            key:
                              description: Key in the Secret's data.
                              minLength: 1
                              type: string
                            name:
                              description: Name of the Secret.
                              minLength: 1
                              type: string
                          required:
                          - key
                          - name
                          type: object
                        service:
                          description: Service is the Worker script name of a service
                            binding.
                          type: string
                        service_id:
                          description: ServiceID of a vpc_service binding (a Workers
                            VPC service).
                          type: string
                        serviceRef:
                          description: ServiceRef names a WorkerScript whose script
                            name is bound.
                          properties:
                            name:
                              type: string
                          required:
                          - name
                          type: object
                        text:
                          description: Text of a plain_text binding.
                          type: string
                        type:
                          description: Type of the binding.
                          enum:
                          - plain_text
                          - secret_text
                          - json
                          - kv_namespace
                          - queue
                          - d1
                          - vpc_service
                          - service
                          type: string
                        vpcServiceRef:
                          description: |-
                            VPCServiceRef names a VPCService whose status.id is the service_id. The VPCService cannot
                            finish deleting while this binding exists (Cloudflare does not check, 0091).
                          properties:
                            name:
                              type: string
                          required:
                          - name
                          type: object
                      required:
                      - name
                      - type
                      type: object
                      x-kubernetes-validations:
                      - message: a kvNamespaceRef, queueRef, d1DatabaseRef, vpcServiceRef
                          or serviceRef needs a non-empty name
                        rule: (!has(self.kvNamespaceRef) || size(self.kvNamespaceRef.name)
                          > 0) && (!has(self.queueRef) || size(self.queueRef.name)
                          > 0) && (!has(self.d1DatabaseRef) || size(self.d1DatabaseRef.name)
                          > 0) && (!has(self.vpcServiceRef) || size(self.vpcServiceRef.name)
                          > 0) && (!has(self.serviceRef) || size(self.serviceRef.name)
                          > 0)
                      - message: text is required for (and only valid with) type plain_text
                        rule: 'self.type == ''plain_text'' ? has(self.text) : !has(self.text)'
                      - message: secretKeyRef is required for (and only valid with)
                          type secret_text
                        rule: 'self.type == ''secret_text'' ? has(self.secretKeyRef)
                          : !has(self.secretKeyRef)'
                      - message: type kv_namespace needs exactly one of namespace_id
                          or kvNamespaceRef (only valid with that type)
                        rule: 'self.type == ''kv_namespace'' ? has(self.namespace_id)
                          != has(self.kvNamespaceRef) : !has(self.namespace_id) &&
                          !has(self.kvNamespaceRef)'
                      - message: type queue needs exactly one of queue_name or queueRef
                          (only valid with that type)
                        rule: 'self.type == ''queue'' ? has(self.queue_name) != has(self.queueRef)
                          : !has(self.queue_name) && !has(self.queueRef)'
                      - message: type d1 needs exactly one of database_id or d1DatabaseRef
                          (only valid with that type)
                        rule: 'self.type == ''d1'' ? has(self.database_id) != has(self.d1DatabaseRef)
                          : !has(self.database_id) && !has(self.d1DatabaseRef)'
                      - message: type vpc_service needs exactly one of service_id
                          or vpcServiceRef (only valid with that type)
                        rule: 'self.type == ''vpc_service'' ? has(self.service_id)
                          != has(self.vpcServiceRef) : !has(self.service_id) && !has(self.vpcServiceRef)'
                      - message: type service needs exactly one of service or serviceRef
                          (only valid with that type, as are environment and entrypoint)
                        rule: 'self.type == ''service'' ? has(self.service) != has(self.serviceRef)
                          : !has(self.service) && !has(self.serviceRef) && !has(self.environment)
                          && !has(self.entrypoint)'
                    maxItems: 64
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  compatibility_date:
                    description: CompatibilityDate of the Workers runtime, e.g. 2026-09-01.
                    pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
                    type: string
                  compatibility_flags:
                    description: CompatibilityFlags of the Workers runtime, e.g. nodejs_compat.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  logpush:
                    description: Logpush enables Workers Trace Events Logpush for
                      the script.
                    type: boolean
                  main_module:
                    description: MainModule is the module that exports the handlers
                      (metadata.main_module).
                    minLength: 1
                    type: string
                  modules:
                    additionalProperties:
                      description: WorkerModule is one module (one multipart part)
                        of the script.
                      properties:
                        content:
                          description: Content of the module.
                          type: string
                        type:
                          default: esm
                          description: |-
                            Type of the module: esm (default), cjs, text, json or wasm-base64 (content is base64 and is
                            uploaded decoded as application/wasm).
                          enum:
                          - esm
                          - cjs
                          - text
                          - json
                          - wasm-base64
                          type: string
                      required:
                      - content
                      type: object
                    description: |-
                      Modules are the script's modules inline: module name (the part and file name, e.g.
                      index.js) → content. Exactly one of modules or sourceRef.
                    maxProperties: 64
                    minProperties: 1
                    type: object
                  observability:
                    description: Observability settings.
                    properties:
                      enabled:
                        description: Enabled turns observability on.
                        type: boolean
                      head_sampling_rate:
                        anyOf:
                        - type: integer
                        - type: string
                        description: HeadSamplingRate from 0 to 1 (a number, or a
                          decimal string such as "0.1").
                        x-kubernetes-int-or-string: true
                        x-kubernetes-validations:
                        - message: must be between 0 and 1
                          rule: 'type(self) == int ? (self == 0 || self == 1) : self.matches(''^(0(\\.[0-9]{1,6})?|1(\\.0{1,6})?)$'')'
                      logs:
                        description: Logs settings.
                        properties:
                          enabled:
                            description: Enabled turns Workers Logs on.
                            type: boolean
                          head_sampling_rate:
                            anyOf:
                            - type: integer
                            - type: string
                            description: HeadSamplingRate of logs, from 0 to 1 (a
                              number, or a decimal string such as "0.1").
                            x-kubernetes-int-or-string: true
                            x-kubernetes-validations:
                            - message: must be between 0 and 1
                              rule: 'type(self) == int ? (self == 0 || self == 1)
                                : self.matches(''^(0(\\.[0-9]{1,6})?|1(\\.0{1,6})?)$'')'
                          invocation_logs:
                            description: InvocationLogs adds one log per invocation.
                            type: boolean
                        required:
                        - enabled
                        type: object
                    required:
                    - enabled
                    type: object
                  script_name:
                    description: ScriptName is the Cloudflare script name. Defaults
                      to metadata.name. Immutable.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9_][a-z0-9-_]*$
                    type: string
                    x-kubernetes-validations:
                    - message: script_name is immutable
                      rule: self == oldSelf
                  sourceRef:
                    description: SourceRef takes the modules from a ConfigMap. Exactly
                      one of modules or sourceRef.
                    properties:
                      name:
                        description: Name of the ConfigMap.
                        minLength: 1
                        type: string
                      types:
                        additionalProperties:
                          type: string
                        description: Types overrides the module type of individual
                          keys (esm, cjs, text, json, wasm-base64).
                        type: object
                    required:
                    - name
                    type: object
                  workersDev:
                    description: WorkersDev enables or disables the script's workers.dev
                      route. Unset leaves it as it is.
                    properties:
                      enabled:
                        description: Enabled serves the script at https://<script>.<account
                          subdomain>.workers.dev.
                        type: boolean
                      previews_enabled:
                        description: PreviewsEnabled serves preview URLs of versions
                          (default false).
                        type: boolean
                    required:
                    - enabled
                    type: object
                required:
                - main_module
                type: object
                x-kubernetes-validations:
                - message: set exactly one of modules or sourceRef
                  rule: has(self.modules) != has(self.sourceRef)
                - message: main_module must name one of modules
                  rule: '!has(self.modules) || self.main_module in self.modules'
                - message: script_name cannot be added or removed
                  rule: has(self.script_name) == has(oldSelf.script_name)
              managementPolicies:
                description: ManagementPolicies default to ["*"]. ["Observe"] makes
                  the object read-only.
                items:
                  description: ManagementAction is one Crossplane-style management
                    policy.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              zoneRef:
                description: ZoneRef is required for zone-scoped kinds and ignored
                  otherwise.
                properties:
                  id:
                    type: string
                  name:
                    type: string
                type: object
            required:
            - accountRef
            type: object
            x-kubernetes-validations:
            - fieldPath: .accountRef.name
              message: accountRef.name must name a CloudflareAccount in this namespace
                (1-253 characters)
              reason: FieldValueInvalid
              rule: size(self.accountRef.name) > 0 && size(self.accountRef.name) <=
                253
            - message: forProvider is required unless managementPolicies exclude Create
                and Update (e.g. ["Observe"])
              rule: has(self.forProvider) || (has(self.managementPolicies) && size(self.managementPolicies)
                > 0 && !('*' in self.managementPolicies) && !('Create' in self.managementPolicies)
                && !('Update' in self.managementPolicies))
          status:
            description: WorkerScriptStatus defines the observed state of a WorkerScript.
            properties:
              atProvider:
                description: AtProvider is the script as last read from Cloudflare.
                properties:
                  bindings:
                    description: Bindings (names and types).
                    items:
                      description: |-
                        WorkerBindingObservation is a binding as Cloudflare reports it (name and type only; values
                        are not copied into status).
                      properties:
                        name:
                          type: string
                        type:
                          type: string
                      required:
                      - name
                      - type
                      type: object
                    type: array
                  compatibility_date:
                    type: string
                  compatibility_flags:
                    items:
                      type: string
                    type: array
                  created_on:
                    type: string
                  deployment_id:
                    description: |-
                      DeploymentID is the active deployment (GET …/deployments; not the upload response's
                      deployment_id, which is the version ID without dashes).
                    type: string
                  etag:
                    description: Etag of the script content.
                    type: string
                  handlers:
                    description: Handlers the script exports (fetch, scheduled, ...).
                    items:
                      type: string
                    type: array
                  id:
                    description: ID is the script name.
                    type: string
                  logpush:
                    type: boolean
                  modified_on:
                    type: string
                  subdomain:
                    description: Subdomain is the workers.dev route (read when forProvider.workersDev
                      is set).
                    properties:
                      enabled:
                        type: boolean
                      previews_enabled:
                        type: boolean
                    required:
                    - enabled
                    - previews_enabled
                    type: object
                  tag:
                    description: Tag is the script's immutable Cloudflare identifier.
                    type: string
                  url:
                    description: URL is https://<script>.<account subdomain>.workers.dev
                      while the route is enabled.
                    type: string
                  usage_model:
                    type: string
                  version_id:
                    description: VersionID is the version the active deployment serves.
                    type: string
                type: object
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              contentHash:
                description: |-
                  ContentHash is a hash of the modules and main_module last uploaded (Cloudflare does not
                  return the content, so a change is detected against this).
                type: string
              id:
                description: ID is the Cloudflare ID of the external resource.
                type: string
              observedGeneration:
                format: int64
                type: integer
              settingsHash:
                description: |-
                  SettingsHash is a hash of the settings last applied (compatibility date and flags,
                  bindings with the IDs they resolved to, observability, logpush). Secret values are
                  tracked in writeOnlyHash.
                type: string
              writeOnlyHash:
                description: WriteOnlyHash is a hash of write-only forProvider fields
                  last applied.
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - fieldPath: .spec.accountRef.name
          message: 'spec.accountRef is immutable once the resource exists (status.id
            is set): the resource lives in that account. To move it, delete this object
            (deletionPolicy Orphan keeps the resource) and create a new one'
          reason: FieldValueInvalid
          rule: '!(has(oldSelf.status) && has(oldSelf.status.id) && size(oldSelf.status.id)
            > 0) || self.spec.accountRef.name == oldSelf.spec.accountRef.name'
    served: true
    storage: true
    subresources:
      status: {}
